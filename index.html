<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Widerspruch! · Bescheidprüfung SGB II</title>
<style>
:root{--bg:#12171c;--panel:#1a2128;--line:#303a45;--muted:#9aa7b5;--text:#edf1f5;--accent:#d83a3a;--good:#23834b;--bad:#c92f2f;--paper:#fff;--ink:#15191d}
*{box-sizing:border-box}html,body,#app{min-height:100%;margin:0}body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;overflow:auto}.logo{font-size:clamp(2.4rem,8vw,3.2rem);font-weight:850;letter-spacing:-1.5px}.sub{font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:22px}.intro{max-width:620px;text-align:center;color:#b4bec8;line-height:1.65;margin:0 0 20px}
.levels{width:100%;max-width:440px;display:grid;gap:9px;margin-bottom:18px}.level{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px;color:var(--text);text-align:left;display:flex;justify-content:space-between;gap:12px}.level[aria-checked=true]{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.level small{color:var(--muted);text-align:right}
.primary,.secondary{border-radius:8px;padding:12px 18px;font-weight:750}.primary{background:var(--accent);border:1px solid var(--accent);color:white;min-width:190px}.secondary{background:transparent;color:#d5dbe1;border:1px solid #46515c}
.wrap{height:100vh;display:flex;flex-direction:column;overflow:hidden}.top,.bottom{background:var(--panel);border-color:var(--line);display:flex;align-items:center;gap:12px;padding:10px 13px;flex-shrink:0}.top{border-bottom:1px solid var(--line);justify-content:space-between}.bottom{border-top:1px solid var(--line)}.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem}.timer.warn{color:#ff7777}.grow{flex:1}.count{font-size:.76rem;color:var(--muted)}.progress{height:3px;background:#2b343e;flex-shrink:0}.progress>div{height:100%;background:var(--accent)}
.paper-scroll,.content-scroll{flex:1;min-height:0;overflow:auto;padding:14px 12px 20px}.paper{background:var(--paper);color:var(--ink);max-width:760px;margin:0 auto;padding:25px 22px;border-radius:3px;box-shadow:0 15px 40px #0008}.letterhead{border-bottom:2px solid var(--ink);padding-bottom:9px;margin-bottom:9px;font-weight:800}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding:7px 0 10px;margin-bottom:12px;color:#68717b;font-size:.66rem}.paper h1{font-size:1rem;margin-bottom:7px}.lead{font-size:.75rem;line-height:1.5;color:#59616a;margin-bottom:12px}.section{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;font-weight:800;border-bottom:1px solid #111;margin:17px 0 5px;padding-bottom:4px}.person{font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:#65707a;font-weight:800;margin:12px 0 3px}
.rowline{display:flex;align-items:baseline;gap:7px;padding:7px 6px;border-radius:3px;cursor:pointer;color:#4b5560;font-size:.77rem}.rowline .dots{flex:1;min-width:8px;border-bottom:1px dotted #c7ccd2;position:relative;top:-3px}.rowline .amount{white-space:nowrap;font:650 .77rem ui-monospace,monospace;color:#111}.rowline.sum{border-top:1px solid #222;margin-top:3px;font-weight:800}.rowline.total{border-top:3px double #111;margin-top:6px;font-weight:850}.rowline.total .label{color:#111}.rowline.selected{background:#fff1f1;box-shadow:inset 3px 0 var(--accent)}.rowline.selected .label{color:#111;font-weight:750;padding-left:5px}.rowline.selected .amount{color:#b51f27}.footnote{font-size:.64rem;line-height:1.5;color:#68717b;border-top:1px solid #ddd;padding-top:9px;margin-top:17px}
.card{background:white;color:#111;border-radius:9px;padding:20px;max-width:600px;margin:0 auto;box-shadow:0 12px 30px #0006}.card h2{font-size:1.1rem;margin-bottom:8px}.card p{font-size:.82rem;color:#56616b;line-height:1.55;margin-bottom:13px}.option{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;background:#f4f6f7;border:1px solid #dce1e5;border-radius:7px;font:650 .78rem ui-monospace,monospace;color:#111}
.result{background:white;color:#111;border-radius:8px;padding:14px;margin:0 auto 10px;max-width:680px;box-shadow:0 5px 16px #0004;border-left:4px solid #9099a2}.result.good{border-left-color:var(--good)}.result.bad{border-left-color:var(--bad)}.result h3{font-size:.92rem;margin:5px 0}.result p{font-size:.8rem;line-height:1.55;color:#4b5560}.tag{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.7px}.endbox{background:var(--panel);border:1px solid var(--line);padding:16px 20px;border-radius:8px;width:100%;max-width:380px;margin:20px 0}.endrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:.84rem;color:var(--muted)}.endrow:last-child{border:0}.endrow b{color:white;font-variant-numeric:tabular-nums}
.dialog{max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;line-height:1.6}.dialog h2{margin-bottom:12px}.dialog p{font-size:.82rem;color:#b6c0c9;margin:9px 0}.overlay{position:fixed;inset:0;background:#080c10ef;z-index:9;display:grid;place-items:center;padding:18px;overflow:auto}
:focus-visible{outline:2px solid #fff;outline-offset:3px}.rowline:focus-visible{outline-color:#111;outline-offset:-2px}
@media(min-width:650px){.paper{padding:30px}.rowline{font-size:.83rem}.rowline .amount{font-size:.83rem}}@media(max-width:520px){.top,.bottom{gap:7px;padding:8px}.paper{padding:17px 13px}.rowline{font-size:.72rem}.rowline .amount{font-size:.72rem}.count{font-size:.68rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><div id="app"></div>
<script type="module" src="./js/app.js"></script></body></html>
